<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くじ引きアプリ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            padding: 50px 20px; 
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
            box-sizing: border-box; 
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
		button:disabled {
			background-color: #ff4757;
			cursor: not-allowed;
		}

		button.disabled,
		button.disabled:hover {
			background-color: #ccc;
		}
        #result {
            margin-top: 30px;
            font-size: 32px;
            font-weight: bold;
            color: #2f3542;
            min-height: 48px;
            transition: transform 0.1s;
        }
        .shake {
            animation: blink 0.1s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.5; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        .probability-info {
            margin-top: 20px;
            font-size: 14px;
            color: #747d8c;
            text-align: left;
        }
        .probability-info table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .probability-info th, .probability-info td {
            border-bottom: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
		.special-background {
			animation: specialFlash 0.4s infinite alternate;
		}

		@keyframes specialFlash {

			0% {
				background: linear-gradient(135deg,#ff0000,#ffff00);
			}

			100% {
				background: linear-gradient(135deg,#00ffff,#0000ff);
			}

		}
		
		#screen-flash {
		position: fixed;
		inset: 0;
		background: black;
		opacity: 0;
		pointer-events: none;
		z-index: 9999;
		transition: opacity 0.1s;
		}

		#screen-flash.active {
			opacity: 1.0;
		}
		
        /* スマホ用の調整（画面幅が480px以下のとき） */
        @media (max-width: 480px) {
            body {
                padding: 20px 10px; /* 上下20px、左右10pxに縮小 */
            }
            .container {
                padding: 20px 15px; /* 左右の余白を15pxにして中身の幅を確保 */
            }
            #result {
                font-size: 26px; /* 文字が大きすぎてはみ出る場合はここを少し小さく調整 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>くじ引き</h2>
    <button id="draw-btn" onclick="startLottery()">押せ！</button>
    <div id="result">？？？</div>
	<div class="probability-info">
		<a target="_blank" href="https://stock-manager-nine-eta.vercel.app/">集計サイト</a>
		<p>【現在の設定】</p>

		<table id="probability-table">
			<thead>
				<tr>
					<th>効果</th>
					<th>確率</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
		</table>
	</div>
	<div id="screen-flash"></div>
</div>

<script>


// ================================
// 景品設定
// ================================
const PRIZES = [
    { name: "赤単色を2倍", weight: 2.0,isLose: false },
    { name: "黒単色を2倍", weight: 2.0,isLose: false },
    { name: "多色を2倍", weight: 2.0,isLose: false },
    { name: "年数×1000", weight: 2.0,isLose: false },
    { name: "Sトリガーなら2倍", weight: 2.0,isLose: false },
    { name: "青単色を2倍", weight: 3.0,isLose: false },
    { name: "お互い追加2枚", weight: 3.0,isLose: false },
    { name: "同値の場合貫通", weight: 3.0,isLose: false },
    { name: "鬼タイム", weight: 3.0,isLose: false },
    { name: "ハイパーモード", weight: 3.0,isLose: false },
    { name: "コスト×1000", weight: 3.0,isLose: false },
    { name: "プラス効果参照", weight: 3.0,isLose: false },
    { name: "マイナス効果参照", weight: 3.0,isLose: false },
    { name: "カード交換", weight: 3.0,isLose: false },
    { name: "ヨビ二オンなら追加1枚", weight: 3.0,isLose: false },
    { name: "💀 はずれ 💀", weight: 60.0 ,isLose: true}
];

// ================================
// 音声
// ================================
const revivalAudio = new Audio("revival.mp3");

// ================================
// 確率表を作成
// ================================
function createProbabilityTable() {

    const tbody = document.querySelector("#probability-table tbody");
    tbody.innerHTML = "";

    const totalWeight = PRIZES.reduce(
        (sum, prize) => sum + prize.weight,
        0
    );

    PRIZES.forEach(prize => {

        const row = document.createElement("tr");

        const effectCell = document.createElement("td");
        effectCell.textContent = prize.name;

        const probabilityCell = document.createElement("td");

        const probability =
            (prize.weight / totalWeight * 100);

        probabilityCell.textContent =
            probability.toFixed(2).replace(/\.?0+$/, "") + "%";

        row.appendChild(effectCell);
        row.appendChild(probabilityCell);

        tbody.appendChild(row);
    });

}

// ================================
// 抽選処理
// ================================
function getLotteryResultData() {

    const totalWeight =
        PRIZES.reduce((sum, prize) => sum + prize.weight, 0);

    const randomNumber =
        Math.random() * totalWeight;

    let currentWeightSum = 0;

    for (const prize of PRIZES) {

        currentWeightSum += prize.weight;

        if (randomNumber < currentWeightSum) {
            return prize;
        }
    }

    return PRIZES[PRIZES.length - 1];
}

// ================================
// 演出設定
// ================================

// ================================
// 通常演出
// ================================
const NORMAL_EFFECTS = [
    {
        type: "sound",
        enabled: true,
        chance: 40,
        file: "bare.mp3"
    },
    {
        type: "longAnimation",
        enabled: true,
        chance: 30,
        duration: 6000
    },
    {
        type: "background",
        enabled: true,
        chance: 30,
        className: "special-background"
    },
    {
        type: "flash",
        enabled: true,
        chance: 20,
        duration: 2000,
        sound: "flash.mp3"
    }
];

function startNormalEffects(effects) {

    playSoundEffect(effects);

    playFlashEffect(effects);

    applyBackgroundEffect(effects);

}

function stopNormalEffects(effects) {

    removeBackgroundEffect(effects);

}

// ================================
// 特殊演出
// ================================
const SPECIAL_EFFECTS = [
    {
        type: "revival",
        enabled: true,
        chance: 50,
        sound: "revival.mp3"
    }
];

function playSpecialEffect(
    specialEffect,
    resultDiv,
    prize,
    callback
) {

    if (!specialEffect) {
        showResult(resultDiv, prize);
        callback();
        return;
    }

    switch (specialEffect.type) {

        case "revival":
            playRevivalEffect(
                specialEffect,
                resultDiv,
                prize,
                callback
            );
            break;

        default:
            showResult(resultDiv, prize);
            callback();
            break;
    }
}
function playSpecialSound() {

    revivalAudio.pause();
    revivalAudio.currentTime = 0;

    revivalAudio.play().catch(err => {
        console.log(err);
    });

}
// ================================
// 演出抽選
// ================================
function rollNormalEffects(isWin) {

    const result = {};

    for (const effect of NORMAL_EFFECTS) {

        result[effect.type] = {
            enabled: false,
            config: effect
        };

        if (!isWin) {
            continue;
        }

        if (!effect.enabled) {
            continue;
        }

        if (Math.random() * 100 < effect.chance) {
            result[effect.type].enabled = true;
        }

    }

    return result;

}

function rollSpecialEffect(isWin) {

    if (!isWin) {
        return null;
    }

    for (const effect of SPECIAL_EFFECTS) {

        if (!effect.enabled) {
            continue;
        }

        if (Math.random() * 100 < effect.chance) {
            return effect;
        }

    }

    return null;

}

// ================================
// 音演出
// ================================
function playSoundEffect(effects) {

    // 暗転演出中は通常音を鳴らさない
    if (effects.flash.enabled) {
        return;
    }

    if (!effects.sound.enabled) {
        return;
    }

    const audio = new Audio(
        effects.sound.config.file
    );

    audio.play().catch(() => {});

}

// ================================
// 暗転演出
// ================================
function playFlashEffect(effects) {

    if (!effects.flash.enabled) {
        return;
    }

    const flash = document.getElementById("screen-flash");

    flash.classList.add("active");

    // 暗転専用SE
    const audio = new Audio(
        effects.flash.config.sound
    );

    audio.play().catch(() => {});

    setTimeout(() => {

        flash.classList.remove("active");

    }, effects.flash.config.duration);

}

// ================================
// 復活演出
// ================================
function playRevivalEffect(
    specialEffect,
    resultDiv,
    prize,
    callback
) {
    resultDiv.classList.remove("shake");
    resultDiv.innerText = "💀 はずれ 💀";

    const btn = document.getElementById("draw-btn");

    setTimeout(() => {

        const flash = document.getElementById("screen-flash");
        flash.classList.add("active");

        playSpecialSound();

        setTimeout(() => {

            flash.classList.remove("active");

            showResult(resultDiv, prize);

            callback();

        }, 800);

    }, 1500);
}
// ================================
// 背景演出開始
// ================================
function applyBackgroundEffect(effects) {

    if (!effects.background.enabled) {
        return;
    }

    document.body.classList.add(
        effects.background.config.className
    );

}

// ================================
// 背景演出終了
// ================================
function removeBackgroundEffect(effects) {

    if (!effects.background.enabled) {
        return;
    }

    document.body.classList.remove(
        effects.background.config.className
    );

}

// ================================
// 演出時間
// ================================
function getAnimationDuration(effects) {

    if (!effects.longAnimation.enabled) {
        return 3000;
    }

    return effects.longAnimation.config.duration;

}

// ================================
// シャッフル開始
// ================================
function startShuffle(resultDiv) {

    return setInterval(() => {

        const randomIndex =
            Math.floor(Math.random() * PRIZES.length);

        resultDiv.innerText =
            PRIZES[randomIndex].name;

    }, 50);

}

// ================================
// シャッフル終了
// ================================
function stopShuffle(intervalId) {

    clearInterval(intervalId);

}

// ================================
// 結果表示
// ================================
function showResult(resultDiv, prize) {

    resultDiv.classList.remove("shake");

    resultDiv.innerText = prize.name;

}

// ================================
// 抽選開始
// ================================
function startLottery() {

    const btn = document.getElementById("draw-btn");
    const resultDiv = document.getElementById("result");

	btn.disabled = true;
	btn.classList.add("disabled");
    resultDiv.classList.add("shake");

    // 景品抽選
    const prize = getLotteryResultData();

    // 特殊演出抽選
    const specialEffect = rollSpecialEffect(!prize.isLose);
	if (specialEffect) {
		setTimeout(() => {
			btn.classList.remove("disabled");
		}, 3000);
	}
    // 通常演出がある場合だけ
    let normalEffects = null;
    let duration = 3000;

    if (!specialEffect) {

        normalEffects = rollNormalEffects(!prize.isLose);

		startNormalEffects(normalEffects);

        duration = getAnimationDuration(normalEffects);

    }

    // シャッフル開始
    const shuffle = startShuffle(resultDiv);

    setTimeout(() => {

        stopShuffle(shuffle);

        if (normalEffects) {
            stopNormalEffects(normalEffects);
        }
		playSpecialEffect(
			specialEffect,
			resultDiv,
			prize,
			() => {
				btn.disabled = false;
				btn.classList.remove("disabled");
			}
		);
    }, duration);
}

// ================================
// 初期化
// ================================
document.getElementById("draw-btn").addEventListener("click", () => {
	revivalAudio.muted = true;

	revivalAudio.play().then(() => {
		revivalAudio.pause();
		revivalAudio.currentTime = 0;
		revivalAudio.muted = false;
	});
}, { once: true });
revivalAudio.load();
createProbabilityTable();

// ================================
// 抽選シミュレーション
// ================================
function testLottery(count = 100000) {

    const results = {};

    PRIZES.forEach(prize => {
        results[prize.name] = 0;
    });

    for (let i = 0; i < count; i++) {
        results[getLotteryResultData().name]++;
    }

    const totalWeight =
        PRIZES.reduce((sum, prize) => sum + prize.weight, 0);

    const table = PRIZES.map(prize => ({
        景品: prize.name,
        重み: prize.weight,
        期待値: (prize.weight / totalWeight * 100).toFixed(2) + "%",
        回数: results[prize.name],
        実測値: (results[prize.name] / count * 100).toFixed(2) + "%"
    }));

    console.table(table);
}

</script>

</body>
</html>
