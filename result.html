<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>結果</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #74b9ff,
                #a29bfe
            );

            font-family:
                'Helvetica Neue',
                Arial,
                sans-serif;

            text-align: center;
        }

        #result {
            font-size: 60px;
            font-weight: bold;
            color: white;

            padding: 30px;
        }

    </style>
</head>

<body>

    <div id="result"></div>

    <script>

        const params =
            new URLSearchParams(window.location.search);

        const result =
            params.get("result");

        document.getElementById("result").textContent =
            result || "結果不明";

    </script>

</body>
</html>
